<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Prompteur">
<title>Prompteur caméra Messacademy</title>
<style>
:root {
  /* Univers sombre de tournage : caméra plein écran, texte blanc sur bandeau, accent corail Messacademy. */
  --nuit: #0E1022; --panneau: #181B33; --trait: #2A2E52; --texte: #F4F2F8; --doux: #A3A6C6; --corail: #FF7A59; --rouge: #FF3B4E;
  --font: "Avenir Next", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: #000; color: var(--texte); font-family: var(--font); overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--corail); outline-offset: 2px; }
.ecran { position: fixed; inset: 0; display: none; }
.ecran.actif { display: flex; }

/* ---------- 1. Scripts ---------- */
#ecran-script { flex-direction: column; background: var(--nuit); padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px); gap: 12px; overflow-y: auto; }
.marque { font-weight: 800; font-size: 20px; } .marque span { color: var(--corail); }
.ligne { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select, #titre { background: var(--panneau); border: 1px solid var(--trait); border-radius: 12px; padding: 10px 12px; flex: 1; min-width: 0; }
#texte { flex: 1; min-height: 200px; background: var(--panneau); border: 1px solid var(--trait); border-radius: 14px; padding: 14px; font-size: 17px; line-height: 1.5; resize: none; }
.infos { color: var(--doux); font-size: 14px; }
.reglage { display: grid; grid-template-columns: 120px 1fr 56px; gap: 10px; align-items: center; font-size: 14px; color: var(--doux); }
.reglage output { color: var(--texte); text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { accent-color: var(--corail); width: 100%; }
.bouton { border: 0; border-radius: 999px; padding: 15px 22px; font-weight: 700; font-size: 17px; }
.principal { background: var(--corail); color: #1A0E0A; }
.secondaire { background: transparent; border: 1px solid var(--trait); padding: 10px 14px; font-size: 14px; }
.erreur { background: #3A1520; border: 1px solid var(--rouge); border-radius: 12px; padding: 12px; font-size: 15px; display: none; }

/* ---------- 2. Tournage ---------- */
#ecran-tournage { background: #000; }
#camera { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
#bandeau {
  position: absolute; left: 0; right: 0; top: 0; overflow: hidden;
  background: linear-gradient(rgba(0,0,0,0.78) 70%, rgba(0,0,0,0));
  padding-top: env(safe-area-inset-top);
}
#defile { will-change: transform; padding: 0 5%; }
#defile div { font-weight: 700; line-height: 1.3; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
#defile .vide { height: 0.8em; }
#repere { position: absolute; left: 0; width: 14px; height: 0; border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-left: 14px solid var(--corail); translate: 0 -9px; }
#rec { position: absolute; top: calc(env(safe-area-inset-top) + 10px); right: 14px; display: none; align-items: center; gap: 6px; background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 999px; font-size: 14px; font-variant-numeric: tabular-nums; }
#rec::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--rouge); }
#compte { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 34vmin; font-weight: 800; color: var(--corail); text-shadow: 0 4px 30px rgba(0,0,0,0.6); pointer-events: none; }
#commandes {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(env(safe-area-inset-bottom) + 18px);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.65));
}
.groupe { display: flex; gap: 6px; align-items: center; }
.groupe.droite { justify-content: flex-end; }
.rond { width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(24,27,51,0.85); font-weight: 700; font-size: 18px; }
#vit { min-width: 36px; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; }
#enregistrer { width: 78px; height: 78px; border-radius: 50%; border: 5px solid #fff; background: transparent; display: flex; align-items: center; justify-content: center; }
#enregistrer span { width: 58px; height: 58px; border-radius: 50%; background: var(--rouge); transition: all .2s; }
#enregistrer.en-cours span { width: 30px; height: 30px; border-radius: 8px; }
#zone-tap { position: absolute; left: 0; right: 0; top: 0; bottom: 140px; }

/* ---------- 3. Résultat ---------- */
#ecran-resultat { flex-direction: column; background: var(--nuit); padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px); gap: 12px; }
#apercu { flex: 1; min-height: 0; width: 100%; background: #000; border-radius: 14px; }
#ecran-resultat .ligne .bouton { flex: 1; }
@media (prefers-reduced-motion: reduce) { #enregistrer span { transition: none; } }
</style>
</head>
<body>

<!-- 1. Choisir et coller le script -->
<section class="ecran actif" id="ecran-script" aria-label="Script">
  <div class="marque">Messa<span>cademy</span> · prompteur caméra</div>
  <div class="ligne">
    <select id="choix" aria-label="Choisir le script"></select>
    <button class="bouton secondaire" id="nouveau" type="button">+ Nouveau</button>
  </div>
  <input id="titre" aria-label="Titre du script">
  <textarea id="texte" aria-label="Texte du script" placeholder="Colle ton script ici."></textarea>
  <div class="infos" id="infos"></div>
  <div class="reglage"><label for="vitesse">Vitesse</label><input type="range" id="vitesse" min="10" max="150" step="5"><output id="vitesse-v"></output></div>
  <div class="reglage"><label for="taille">Taille du texte</label><input type="range" id="taille" min="18" max="64" step="2"><output id="taille-v"></output></div>
  <div class="reglage"><label for="bande">Hauteur du texte</label><input type="range" id="bande" min="20" max="60" step="5"><output id="bande-v"></output></div>
  <div class="erreur" id="erreur" role="alert"></div>
  <button class="bouton principal" id="ouvrir" type="button">🎥 Ouvrir la caméra</button>
</section>

<!-- 2. Se filmer en lisant -->
<section class="ecran" id="ecran-tournage" aria-label="Tournage">
  <video id="camera" playsinline autoplay muted></video>
  <div id="bandeau"><div id="defile"></div><div id="repere"></div></div>
  <div id="zone-tap" aria-hidden="true"></div>
  <div id="rec">00:00</div>
  <div id="compte"></div>
  <div id="commandes">
    <div class="groupe">
      <button class="rond" id="retour" type="button" aria-label="Retour au script">✕</button>
      <button class="rond" id="debut" type="button" aria-label="Revenir au début du texte">⤒</button>
    </div>
    <button id="enregistrer" type="button" aria-label="Démarrer ou arrêter l'enregistrement"><span></span></button>
    <div class="groupe droite">
      <button class="rond" id="moins" type="button" aria-label="Moins vite">−</button>
      <span id="vit"></span>
      <button class="rond" id="plus" type="button" aria-label="Plus vite">+</button>
    </div>
  </div>
</section>

<!-- 3. Récupérer la vidéo -->
<section class="ecran" id="ecran-resultat" aria-label="Ta vidéo">
  <div class="marque">Ta prise est prête</div>
  <video id="apercu" controls playsinline></video>
  <div class="infos" id="infos-video"></div>
  <div class="ligne">
    <button class="bouton principal" id="partager" type="button">Enregistrer la vidéo</button>
  </div>
  <div class="ligne">
    <button class="bouton secondaire" id="refaire" type="button">Refaire une prise</button>
    <button class="bouton secondaire" id="vers-script" type="button">Changer de script</button>
  </div>
</section>

<script>
const $ = (id) => document.getElementById(id);
const CLE = "messacademy-prompteur-camera-v1";
const TITRES = ["Le setting et le closing, c'est quoi ?", "La posture qui fait réussir", "Comment fonctionne la prospection",
  "La conversation qui mène au rendez-vous", "Les relances et les erreurs à éviter", "S'organiser comme un pro",
  "Préparer et structurer un appel de vente", "Traiter les objections", "Ton plan d'action et la suite"];
const EXEMPLE = "Salut, et bienvenue dans cette première vidéo de Messacademy.\n\nAujourd'hui, on part de la base : le setting et le closing, c'est quoi exactement ?\n\nLe setter, c'est la personne qui démarre la conversation, qui comprend le besoin, et qui cale le rendez-vous.\n\nLe closer, lui, mène l'appel de vente. Il aide la personne à prendre une décision claire.\n\nOn se retrouve dans la prochaine vidéo.";

let etat;
try { etat = JSON.parse(localStorage.getItem(CLE)); } catch (e) {}
if (!etat) etat = {
  scripts: TITRES.map((t, i) => ({ id: "v" + (i + 1), titre: `Vidéo ${String(i + 1).padStart(2, "0")} · ${t}`, texte: i === 0 ? EXEMPLE : "" })),
  actif: "v1", r: { vitesse: 45, taille: 30, bande: 35 },
};
const sauver = () => { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {} };
const courant = () => etat.scripts.find((s) => s.id === etat.actif) || etat.scripts[0];
const R = etat.r;
const ecran = (id) => document.querySelectorAll(".ecran").forEach((e) => e.classList.toggle("actif", e.id === id));

/* ---------- Scripts ---------- */
function remplir() {
  const c = $("choix"); c.innerHTML = "";
  etat.scripts.forEach((s) => { const o = document.createElement("option"); o.value = s.id; o.textContent = s.titre + (s.texte.trim() ? "" : " (vide)"); c.appendChild(o); });
  c.value = courant().id; $("titre").value = courant().titre; $("texte").value = courant().texte; infos();
}
function infos() {
  const n = (courant().texte.trim().match(/\S+/g) || []).length; const s = Math.round(n / 150 * 60);
  $("infos").textContent = `${n} mots · environ ${s < 60 ? s + " s" : Math.floor(s / 60) + " min " + String(s % 60).padStart(2, "0")} à l'oral`;
}
$("choix").addEventListener("change", (e) => { etat.actif = e.target.value; sauver(); remplir(); });
$("titre").addEventListener("input", (e) => { courant().titre = e.target.value; sauver(); });
$("titre").addEventListener("change", remplir);
$("texte").addEventListener("input", (e) => { courant().texte = e.target.value; sauver(); infos(); });
$("nouveau").addEventListener("click", () => { const id = "s" + Date.now(); etat.scripts.push({ id, titre: "Nouveau script", texte: "" }); etat.actif = id; sauver(); remplir(); $("texte").focus(); });
const lib = { vitesse: (v) => v, taille: (v) => v + " px", bande: (v) => v + " %" };
["vitesse", "taille", "bande"].forEach((k) => {
  $(k).value = R[k]; $(k + "-v").textContent = lib[k](R[k]);
  $(k).addEventListener("input", () => { R[k] = Number($(k).value); $(k + "-v").textContent = lib[k](R[k]); sauver(); });
});

/* ---------- Caméra ---------- */
let flux = null;
async function ouvrirCamera() {
  $("erreur").style.display = "none";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return erreur("Ce navigateur ne donne pas accès à la caméra ici. Ouvre la page avec un lien https (voir le mode d'emploi), dans Safari sur iPhone ou Chrome sur Mac.");
  }
  try {
    flux = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1080 }, height: { ideal: 1920 }, frameRate: { ideal: 30 } },
      audio: { echoCancellation: true, noiseSuppression: true },
    });
  } catch (e) {
    return erreur("La caméra ou le micro sont refusés. Autorise-les quand le navigateur te le demande (sur iPhone : Réglages › Safari › Caméra et Micro), puis réessaie.");
  }
  $("camera").srcObject = flux;
  preparerTexte(); ecran("ecran-tournage");
}
function erreur(t) { const e = $("erreur"); e.textContent = t; e.style.display = "block"; }
function fermerCamera() { if (flux) flux.getTracks().forEach((t) => t.stop()); flux = null; }
$("ouvrir").addEventListener("click", ouvrirCamera);

/* ---------- Texte qui défile ---------- */
let y = 0, defileActif = false, dernier = 0, raf = 0;
function preparerTexte() {
  const d = $("defile"); d.innerHTML = "";
  (courant().texte.trim() || "Ton script est vide : reviens en arrière et colle ton texte.").split("\n").forEach((l) => {
    const div = document.createElement("div"); if (l.trim()) div.textContent = l; else div.className = "vide"; d.appendChild(div);
  });
  d.querySelectorAll("div").forEach((x) => (x.style.fontSize = R.taille + "px"));
  const h = window.innerHeight * R.bande / 100;
  $("bandeau").style.height = h + "px";
  // la ligne de lecture est au tiers du bandeau : tes yeux restent près de l'objectif
  const ligne = Math.round(h * 0.33);
  $("repere").style.top = ligne + "px";
  d.style.paddingTop = ligne + "px"; d.style.paddingBottom = h + "px";
  y = 0; dessiner(); $("vit").textContent = R.vitesse;
}
function dessiner() { $("defile").style.transform = `translateY(${-y}px)`; }
function boucle(t) {
  if (!defileActif) return;
  const dt = dernier ? (t - dernier) / 1000 : 0; dernier = t;
  y += R.vitesse * dt * (R.taille / 30);
  const d = $("defile"); const max = d.scrollHeight - parseFloat(d.style.paddingTop) - parseFloat(d.style.paddingBottom);
  if (y >= max) { y = max; defileActif = false; }
  dessiner(); raf = requestAnimationFrame(boucle);
}
function lancerDefile() { if (defileActif) return; defileActif = true; dernier = 0; raf = requestAnimationFrame(boucle); }
function pauseDefile() { defileActif = false; cancelAnimationFrame(raf); }
$("zone-tap").addEventListener("click", () => (defileActif ? pauseDefile() : lancerDefile()));
let tY = null;
$("zone-tap").addEventListener("touchstart", (e) => { tY = e.touches[0].clientY; }, { passive: true });
$("zone-tap").addEventListener("touchmove", (e) => { const dy = e.touches[0].clientY - tY; tY = e.touches[0].clientY; y = Math.max(0, y - dy); dessiner(); }, { passive: true });
const vitesse = (d) => { R.vitesse = Math.min(150, Math.max(10, R.vitesse + d)); $("vit").textContent = R.vitesse; $("vitesse").value = R.vitesse; $("vitesse-v").textContent = R.vitesse; sauver(); };
$("moins").addEventListener("click", () => vitesse(-5));
$("plus").addEventListener("click", () => vitesse(5));
$("debut").addEventListener("click", () => { pauseDefile(); y = 0; dessiner(); });

/* ---------- Enregistrement (le texte n'est PAS dans la vidéo) ---------- */
let rec = null, morceaux = [], debutRec = 0, minuteur = 0, compte = 0, video = null;
const typeVideo = () => ["video/mp4;codecs=avc1,mp4a", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm"].find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
function demarrerAvecDecompte() {
  let n = 3; const c = $("compte"); c.textContent = n; c.style.display = "flex";
  compte = setInterval(() => {
    n -= 1;
    if (n > 0) { c.textContent = n; return; }
    clearInterval(compte); compte = 0; c.style.display = "none"; demarrerRec();
  }, 1000);
}
function demarrerRec() {
  if (!window.MediaRecorder) { alert("L'enregistrement n'est pas pris en charge par ce navigateur."); return; }
  morceaux = []; const type = typeVideo();
  rec = new MediaRecorder(flux, type ? { mimeType: type, videoBitsPerSecond: 8000000 } : undefined);
  rec.ondataavailable = (e) => { if (e.data && e.data.size) morceaux.push(e.data); };
  rec.onstop = finRec;
  rec.start(1000);
  debutRec = Date.now(); $("rec").style.display = "flex"; $("enregistrer").classList.add("en-cours");
  minuteur = setInterval(() => { const s = Math.floor((Date.now() - debutRec) / 1000); $("rec").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }, 250);
  lancerDefile();
}
function arreterRec() { if (rec && rec.state !== "inactive") rec.stop(); pauseDefile(); clearInterval(minuteur); $("rec").style.display = "none"; $("enregistrer").classList.remove("en-cours"); }
function finRec() {
  const type = (rec && rec.mimeType) || "video/mp4";
  const blob = new Blob(morceaux, { type });
  const ext = type.includes("mp4") ? "mp4" : "webm";
  const nom = courant().titre.replace(/[^\p{L}\p{N} ]+/gu, "").trim().slice(0, 50) || "video";
  video = { blob, nom: `${nom} - prise ${new Date().toLocaleTimeString("fr-FR").replace(/:/g, "h").slice(0, 5)}.${ext}`, type };
  const a = $("apercu"); a.src = URL.createObjectURL(blob);
  $("infos-video").textContent = `${(blob.size / 1e6).toFixed(1)} Mo · ${ext.toUpperCase()}`;
  fermerCamera(); ecran("ecran-resultat");
}
$("enregistrer").addEventListener("click", () => {
  if (compte) return;
  if (rec && rec.state === "recording") arreterRec(); else demarrerAvecDecompte();
});
$("retour").addEventListener("click", () => { if (rec && rec.state === "recording") return; fermerCamera(); pauseDefile(); ecran("ecran-script"); });

/* ---------- Sauvegarde ---------- */
$("partager").addEventListener("click", async () => {
  if (!video) return;
  const fichier = new File([video.blob], video.nom, { type: video.type });
  // Sur iPhone : la feuille de partage propose « Enregistrer la vidéo » (dans Photos)
  if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
    try { await navigator.share({ files: [fichier], title: video.nom }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(video.blob); a.download = video.nom; document.body.appendChild(a); a.click(); a.remove();
});
$("refaire").addEventListener("click", ouvrirCamera);
$("vers-script").addEventListener("click", () => ecran("ecran-script"));

remplir();
</script>
</body>
</html>
